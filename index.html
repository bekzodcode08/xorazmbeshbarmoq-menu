<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xorazm Beshbarmoq — Restoran Menyusi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b2521;
    --bg-deep:#071815;
    --panel:#123a33;
    --panel-soft:#0f322c;
    --cream:#f6efdf;
    --cream-dim:rgba(246,239,223,0.62);
    --gold:#cd9d51;
    --gold-bright:#e9c785;
    --terracotta:#b5582f;
    --line:rgba(246,239,223,0.14);
    --shadow:0 20px 50px rgba(0,0,0,0.45);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg-deep);
    color:var(--cream);
    font-family:'Manrope', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3{font-family:'Fraunces', serif; margin:0;}
  img{-webkit-user-drag:none; user-select:none;}
  ::selection{background:var(--gold); color:var(--bg-deep);}

  /* ---------- texture ---------- */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:radial-gradient(circle at 1px 1px, rgba(246,239,223,0.05) 1px, transparent 0);
    background-size:22px 22px;
    pointer-events:none;
    z-index:0;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    min-height:100svh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:80px 24px 56px;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, #1c4a41 0%, var(--bg) 46%, var(--bg-deep) 100%);
  }
  .hero-bgimg{
    position:absolute; inset:0;
    background-image:url('assets/menu-9a.jpg');
    background-size:cover;
    background-position:center 30%;
    opacity:0.16;
    filter:saturate(1.1) contrast(1.05);
    mask-image:linear-gradient(to bottom, transparent, rgba(0,0,0,.9) 35%, rgba(0,0,0,.9) 70%, transparent);
  }
  .hero-glow{
    position:absolute;
    top:8%; left:50%; transform:translateX(-50%);
    width:520px; height:520px;
    background:radial-gradient(circle, rgba(205,157,81,0.30), transparent 70%);
    filter:blur(10px);
    pointer-events:none;
    animation:glowPulse 6s ease-in-out infinite;
  }
  @keyframes glowPulse{
    0%,100%{opacity:0.75; transform:translateX(-50%) scale(1);}
    50%{opacity:1; transform:translateX(-50%) scale(1.08);}
  }
  .arch{
    position:relative;
    width:min(78vw, 320px);
    aspect-ratio:1/1.18;
    margin:0 auto 6px;
    display:flex; align-items:center; justify-content:center;
  }
  .arch svg{position:absolute; inset:0; width:100%; height:100%;}
  .arch .logo-img{
    position:relative;
    width:64%;
    height:auto;
    filter:drop-shadow(0 10px 30px rgba(0,0,0,0.55));
    animation:floaty 5s ease-in-out infinite;
  }
  @keyframes floaty{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
  }
  .eyebrow{
    margin-top:18px;
    font-family:'Manrope', sans-serif;
    font-size:12px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--gold-bright);
    font-weight:700;
  }
  .hero h1{
    margin-top:10px;
    font-size:clamp(34px, 9vw, 58px);
    font-weight:900;
    line-height:1.02;
    letter-spacing:-0.01em;
    color:var(--cream);
  }
  .hero h1 span{
    display:block;
    font-size:0.5em;
    font-weight:600;
    font-style:italic;
    color:var(--gold-bright);
    margin-top:6px;
  }
  .hero p.tag{
    margin-top:16px;
    font-size:14.5px;
    letter-spacing:0.04em;
    color:var(--cream-dim);
    max-width:320px;
  }
  .scrollcue{
    margin-top:44px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    color:var(--cream-dim);
    font-size:11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
  }
  .scrollcue .dot{
    width:1px; height:34px;
    background:linear-gradient(var(--gold-bright), transparent);
    animation:dropcue 1.8s ease-in-out infinite;
  }
  @keyframes dropcue{
    0%{transform:scaleY(0); transform-origin:top;}
    50%{transform:scaleY(1); transform-origin:top;}
    51%{transform-origin:bottom;}
    100%{transform:scaleY(0); transform-origin:bottom;}
  }

  /* ---------- NAV ---------- */
  .navwrap{
    position:sticky; top:0; z-index:30;
    background:rgba(7,24,21,0.86);
    backdrop-filter:blur(14px) saturate(1.2);
    border-bottom:1px solid var(--line);
  }
  nav{
    display:flex; gap:8px;
    overflow-x:auto;
    padding:12px 14px;
    scrollbar-width:none;
    max-width:640px;
    margin:0 auto;
  }
  nav::-webkit-scrollbar{display:none;}
  nav a{
    flex:0 0 auto;
    display:flex; align-items:center; gap:6px;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.01em;
    color:var(--cream);
    opacity:0.62;
    text-decoration:none;
    padding:9px 14px 9px 10px;
    border:1px solid var(--line);
    border-radius:100px;
    white-space:nowrap;
    transition:all .2s ease;
  }
  nav a svg{width:15px; height:15px; flex:0 0 auto; opacity:0.9;}
  nav a.active{
    background:var(--gold);
    color:#211205;
    opacity:1;
    border-color:var(--gold);
  }

  /* ---------- MAIN / CATEGORIES ---------- */
  main{max-width:640px; margin:0 auto; position:relative; z-index:1; padding-bottom:20px;}

  .cat{
    padding:52px 20px 8px;
    scroll-margin-top:66px;
    opacity:0;
    transform:translateY(22px);
    transition:opacity .7s ease, transform .7s ease;
  }
  .cat.in{opacity:1; transform:translateY(0);}

  .cat-head{
    display:flex; align-items:center; gap:12px;
    justify-content:center;
    margin-bottom:6px;
  }
  .cat-head .ic{
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line);
    border-radius:50%;
    color:var(--gold-bright);
    background:var(--panel-soft);
    flex:0 0 auto;
  }
  .cat-head .ic svg{width:18px; height:18px;}
  .cat-head h2{
    font-size:23px;
    font-weight:700;
    color:var(--cream);
    letter-spacing:0.01em;
  }
  .cat-count{
    text-align:center;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--cream-dim);
    margin-bottom:22px;
  }

  .viewer{position:relative;}
  .track{
    display:flex;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    gap:14px;
    scrollbar-width:none;
    border-radius:22px;
  }
  .track::-webkit-scrollbar{display:none;}
  .slide{
    flex:0 0 100%;
    scroll-snap-align:center;
    position:relative;
  }
  .frame{
    position:relative;
    border-radius:22px;
    overflow:hidden;
    border:1px solid var(--line);
    box-shadow:var(--shadow);
    background:var(--panel);
    cursor:zoom-in;
  }
  .frame img{
    display:block;
    width:100%;
    height:auto;
    transition:transform .5s ease;
  }
  .frame:active img{transform:scale(0.98);}
  .frame::after{
    content:"⤢ Kattalashtirish";
    position:absolute;
    right:10px; bottom:10px;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.06em;
    color:var(--cream);
    background:rgba(7,20,18,0.55);
    backdrop-filter:blur(6px);
    padding:6px 10px;
    border-radius:100px;
    border:1px solid rgba(246,239,223,0.18);
  }

  .dots{
    display:flex; justify-content:center; gap:7px;
    margin-top:14px;
  }
  .dots button{
    width:6px; height:6px;
    border-radius:50%;
    border:none;
    padding:0;
    background:var(--line);
    cursor:pointer;
    transition:all .2s ease;
  }
  .dots button.active{
    background:var(--gold-bright);
    width:18px; border-radius:4px;
  }

  /* ---------- ARCH DIVIDER ---------- */
  .divider{
    display:flex; justify-content:center;
    padding:38px 0 0;
    color:var(--gold);
    opacity:0.55;
  }
  .divider svg{width:46px; height:22px;}

  /* ---------- LIGHTBOX ---------- */
  .lightbox{
    position:fixed; inset:0;
    background:rgba(4,12,10,0.92);
    backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
    padding:26px 14px;
  }
  .lightbox.open{opacity:1; pointer-events:auto;}
  .lightbox img{
    max-width:100%;
    max-height:92vh;
    border-radius:14px;
    box-shadow:0 30px 70px rgba(0,0,0,0.6);
    touch-action:pinch-zoom;
  }
  .lightbox .close{
    position:absolute; top:20px; right:20px;
    width:40px; height:40px;
    border-radius:50%;
    border:1px solid var(--line);
    background:rgba(246,239,223,0.08);
    color:var(--cream);
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .lightbox .hint{
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
    color:var(--cream-dim);
  }

  /* ---------- BACK TO TOP ---------- */
  .totop{
    position:fixed; right:16px; bottom:20px;
    width:44px; height:44px;
    border-radius:50%;
    background:var(--gold);
    color:#211205;
    border:none;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 12px 30px rgba(0,0,0,0.4);
    opacity:0; pointer-events:none;
    transform:translateY(10px);
    transition:all .25s ease;
    z-index:40;
    cursor:pointer;
  }
  .totop.show{opacity:1; pointer-events:auto; transform:translateY(0);}
  .totop svg{width:18px; height:18px;}

  footer{
    text-align:center;
    padding:54px 24px 46px;
    position:relative; z-index:1;
  }
  footer .flogo{width:56px; height:auto; opacity:0.9; margin-bottom:14px;}
  footer h3{
    font-size:19px; color:var(--gold-bright); font-weight:600; font-style:italic;
  }
  footer p{
    margin-top:8px;
    font-size:12px;
    letter-spacing:0.08em;
    color:var(--cream-dim);
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  @media (min-width:700px){
    .cat-head h2{font-size:26px;}
    .frame{border-radius:26px;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-bgimg"></div>
  <div class="hero-glow"></div>
  <div class="arch">
    <svg viewBox="0 0 320 378" fill="none">
      <path d="M20 378V150C20 74 84 12 160 12C236 12 300 74 300 150V378" stroke="url(#g1)" stroke-width="1.4" opacity="0.55"/>
      <path d="M50 378V158C50 92 99 42 160 42C221 42 270 92 270 158V378" stroke="url(#g1)" stroke-width="1" opacity="0.35"/>
      <defs>
        <linearGradient id="g1" x1="160" y1="12" x2="160" y2="378" gradientUnits="userSpaceOnUse">
          <stop stop-color="#e9c785"/>
          <stop offset="1" stop-color="#e9c785" stop-opacity="0"/>
        </linearGradient>
      </defs>
    </svg>
    <img class="logo-img" src="assets/logo.png" style="border-radius: 50%;"alt="Xorazm Beshbarmoq logotipi">
  </div>
  <div class="eyebrow">Restoran &nbsp;•&nbsp; Xorazm taomlari</div>
  <h1>XORAZM<br>BESHBARMOQ<span>Milliy did, zamonaviy tajriba</span></h1>
  <p class="tag">Tanaga kuch, ruhga quvvat — to'liq menyu bilan tanishing</p>
  <div class="scrollcue"><span>Menyu</span><span class="dot"></span></div>
</div>

<div class="navwrap">
  <nav id="navBar"></nav>
</div>

<main id="main"></main>

<footer>
  <img class="flogo" src="assets/logo.png"style="border-radius:50%;" alt="">
  <h3>Xorazm Beshbarmoq</h3>
  <p>TANAGA KUCH, RUHGA QUVVAT</p>
</footer>

<div class="lightbox" id="lightbox">
  <button class="close" id="lbClose" aria-label="Yopish">✕</button>
  <img id="lbImg" src="" alt="">
  <div class="hint">Kattalashtirish uchun barmoqlaringizni surating</div>
</div>

<button class="totop" id="totop" aria-label="Yuqoriga">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
</button>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="ic-bowl" viewBox="0 0 24 24"><path d="M3 11h18a9 8 0 0 1-18 0Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 11c0-2.2 1-3.2 1-3.2M12 11c0-2.8 1.6-4.4 1.6-4.4M16 11c0-2.2 1-3.2 1-3.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="ic-skewer" viewBox="0 0 24 24"><line x1="2" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><rect x="6" y="9" width="3.2" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="11.4" y="9" width="3.2" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="16.8" y="9" width="3.2" height="6" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="ic-flame" viewBox="0 0 24 24"><path d="M12 2c2 3-1 4.5-1 7.5a3 3 0 1 0 6 0c0-2-1-3-1-5 3 2 4 5 4 8.2A7 7 0 1 1 6 12.7c0-4.3 3.4-6.6 6-10.7Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="ic-fish" viewBox="0 0 24 24"><path d="M2 12c3.4-4.2 9.4-6 14-3l4-2.2v10.4L16 15c-4.6 3-10.6 1.2-14-3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="14.3" cy="9.6" r="0.9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="ic-utensils" viewBox="0 0 24 24"><path d="M6 2v7M4 2v4.2a2 2 0 0 0 4 0V2M6 9v13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 2c-2.2 0-3.4 2.1-3.4 5.2 0 2.6 1.2 4 3.4 4.4V22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="ic-samsa" viewBox="0 0 24 24"><path d="M12 3 21 19H3Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 19q1.2-1.2 2.4 0t2.4 0 2.4 0 2.4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="ic-leg" viewBox="0 0 24 24"><path d="M13.5 3.2c2.8-0.4 5 1.6 4.8 4.4-0.2 2-1.4 3-2.4 4l-4.6 4.6c-1.8 1.8-4.6 1.8-5.6-0.2-1.6-1.8-1.6-4.6 0.2-6.2l4.6-4.6c0.8-0.8 1.8-1.8 3-2Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="6.6" cy="17.2" r="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="ic-dumpling" viewBox="0 0 24 24"><circle cx="8" cy="9.5" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="15.4" cy="8.6" r="3.4" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="11.2" cy="16" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="ic-soup" viewBox="0 0 24 24"><path d="M3 11h15a8 7 0 0 1-15 0Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 2.5c-1.2 2-1.2 4.4 0 6.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><ellipse cx="18.6" cy="2.3" rx="1.1" ry="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="ic-leaf" viewBox="0 0 24 24"><path d="M4 20C4 10 12 4 20 4c0 8.4-6.2 16-16 16Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M6.4 17.6C10 14 14 10 17.6 6.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="ic-bread" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 6.5v11M6.5 12h11M8.4 8.4l7.2 7.2M15.6 8.4l-7.2 7.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/></symbol>
    <symbol id="ic-teapot" viewBox="0 0 24 24"><path d="M3.5 13a6.5 4.6 0 0 0 13 0Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M16.5 11.2c2 0 3.2 0.9 3.2 1.9s-1.2 1.9-3.2 1.9" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 13V8.6M9 13V6.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M8 6.2h4.6L11.6 3H9Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="ic-bottle" viewBox="0 0 24 24"><path d="M10 2.2h4v3l2 2.8v11.8a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V8l2-2.8Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8.2 12.4h7.6" stroke="currentColor" stroke-width="1.4"/></symbol>
    <symbol id="ic-jug" viewBox="0 0 24 24"><path d="M7 3h8l1.2 4.4-2.2 2V19a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2V9.4L6 7.4Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M16 9.6c2.2 0.2 3.4 1.3 3.4 2.9s-1.2 2.7-3.4 2.9" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="ic-arch" viewBox="0 0 46 22"><path d="M2 22V12C2 5.4 11.2 0 23 0s21 5.4 21 12v10" stroke="currentColor" stroke-width="1.4" fill="none"/><circle cx="23" cy="18" r="1.6" fill="currentColor" stroke="none"/></symbol>
  </defs>
</svg>

<script>
  const CATS = [
    {id:'beshbarmoq', name:'Beshbarmoq', icon:'ic-bowl', imgs:['menu-1a.jpg','menu-1b.jpg']},
    {id:'kabob', name:'Kabob', icon:'ic-skewer', imgs:['menu-2a.jpg']},
    {id:'shashlik', name:'Shashlik', icon:'ic-flame', imgs:['menu-2b.jpg']},
    {id:'baliq', name:'Baliq', icon:'ic-fish', imgs:['menu-3a.jpg']},
    {id:'boshqa', name:'Boshqa taomlar', icon:'ic-utensils', imgs:['menu-3b.jpg']},
    {id:'somsa', name:"So'msa", icon:'ic-samsa', imgs:['menu-4a.jpg']},
    {id:'tovuq', name:'Tovuq', icon:'ic-leg', imgs:['menu-4b.jpg']},
    {id:'barak', name:'Barak', icon:'ic-dumpling', imgs:['menu-5a.jpg']},
    {id:'shorva', name:"Sho'rva", icon:'ic-soup', imgs:['menu-5b.jpg']},
    {id:'salat', name:'Salatlar', icon:'ic-leaf', imgs:['menu-6a.jpg','menu-6b.jpg','menu-7a.jpg','menu-7b.jpg']},
    {id:'non', name:'Non', icon:'ic-bread', imgs:['menu-8a.jpg']},
    {id:'choy', name:'Choy', icon:'ic-teapot', imgs:['menu-8b.jpg']},
    {id:'ichimlik', name:'Ichimlik', icon:'ic-bottle', imgs:['menu-9a.jpg']},
    {id:'ayron', name:'Ayron', icon:'ic-jug', imgs:['menu-9b.jpg']},
  ];

  const navBar = document.getElementById('navBar');
  const main = document.getElementById('main');

  CATS.forEach((cat, ci) => {
    // nav pill
    const a = document.createElement('a');
    a.href = '#' + cat.id;
    a.innerHTML = `<svg><use href="#${cat.icon}"/></svg>${cat.name}`;
    navBar.appendChild(a);

    // section
    const sec = document.createElement('section');
    sec.className = 'cat';
    sec.id = cat.id;

    const multi = cat.imgs.length > 1;
    sec.innerHTML = `
      <div class="cat-head">
        <span class="ic"><svg><use href="#${cat.icon}"/></svg></span>
        <h2>${cat.name}</h2>
      </div>
      ${multi ? `<div class="cat-count">${cat.imgs.length} ta sahifa — suring</div>` : ''}
      <div class="viewer">
        <div class="track">
          ${cat.imgs.map(src => `
            <div class="slide">
              <div class="frame"><img src="assets/${src}" alt="${cat.name} menyu sahifasi" loading="lazy"></div>
            </div>`).join('')}
        </div>
        ${multi ? `<div class="dots">${cat.imgs.map((_,i)=>`<button data-i="${i}" class="${i===0?'active':''}"></button>`).join('')}</div>` : ''}
      </div>
      ${ci < CATS.length-1 ? `<div class="divider"><svg><use href="#ic-arch"/></svg></div>` : ''}
    `;
    main.appendChild(sec);
  });

  // carousel dot sync
  document.querySelectorAll('.viewer').forEach(v => {
    const track = v.querySelector('.track');
    const dots = v.querySelectorAll('.dots button');
    if(!dots.length) return;
    dots.forEach(d => d.addEventListener('click', () => {
      const i = +d.dataset.i;
      track.scrollTo({left: track.clientWidth * i, behavior:'smooth'});
    }));
    track.addEventListener('scroll', () => {
      const i = Math.round(track.scrollLeft / track.clientWidth);
      dots.forEach(d => d.classList.toggle('active', +d.dataset.i === i));
    }, {passive:true});
  });

  // lightbox
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  document.querySelectorAll('.frame img').forEach(img => {
    img.addEventListener('click', () => {
      lbImg.src = img.src;
      lightbox.classList.add('open');
    });
  });
  function closeLB(){ lightbox.classList.remove('open'); lbImg.src=''; }
  document.getElementById('lbClose').addEventListener('click', closeLB);
  lightbox.addEventListener('click', e => { if(e.target === lightbox) closeLB(); });

  // nav active state on scroll
  const links = document.querySelectorAll('#navBar a');
  const sections = document.querySelectorAll('.cat');
  const navObs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        links.forEach(l=>l.classList.remove('active'));
        const id = e.target.getAttribute('id');
        const active = document.querySelector('#navBar a[href="#'+id+'"]');
        if(active){
          active.classList.add('active');
          active.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
        }
      }
      if(e.isIntersecting) e.target.classList.add('in');
    });
  }, {rootMargin:'-38% 0px -52% 0px'});
  sections.forEach(s=>navObs.observe(s));

  // fade-in on view (separate, gentler threshold so it shows before centered)
  const revealObs = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); });
  }, {threshold:0.08});
  sections.forEach(s=>revealObs.observe(s));

  // back to top
  const totop = document.getElementById('totop');
  window.addEventListener('scroll', () => {
    totop.classList.toggle('show', window.scrollY > 800);
  }, {passive:true});
  totop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
</script>

</body>
</html>
